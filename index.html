<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>아울렛 부가세 계산기</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      background: #f5f5f5;
      color: #111;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Noto Sans KR", sans-serif;
      padding: 22px 14px;
    }

    .calculator {
      width: 100%;
      max-width: 430px;
      margin: 35px auto 0;
      padding: 28px 22px;
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 14px 38px rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }

    h1 {
      margin: 0 0 30px;
      font-size: 27px;
      line-height: 1.3;
      letter-spacing: -1px;
    }

    .field {
      width: 100%;
      margin-bottom: 22px;
    }

    label {
      display: block;
      margin-bottom: 9px;
      font-size: 17px;
      font-weight: 750;
    }

    .input-wrap {
      position: relative;
      width: 100%;
    }

    input {
      display: block;
      width: 100%;
      min-width: 0;
      height: 52px;
      padding: 0 50px 0 15px;
      border: 1px solid #ccc;
      border-radius: 13px;
      background: #fff;
      color: #111;
      font-size: 20px;
      font-weight: 600;
      outline: none;
      appearance: none;
      -webkit-appearance: none;
    }

    input:focus {
      border-color: #111;
      box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.07);
    }

    .unit {
      position: absolute;
      top: 50%;
      right: 15px;
      transform: translateY(-50%);
      color: #666;
      font-size: 15px;
      font-weight: 700;
      pointer-events: none;
    }

    .results {
      margin-top: 28px;
      border-top: 1px solid #e6e6e6;
    }

    .result-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-width: 0;
      padding: 18px 0;
      border-bottom: 1px solid #e9e9e9;
    }

    .result-label {
      flex-shrink: 0;
      font-size: 17px;
      font-weight: 500;
    }

    .result-value {
      min-width: 0;
      font-size: 21px;
      font-weight: 800;
      text-align: right;
      white-space: nowrap;
    }

    .purchase .result-value {
      font-size: 25px;
    }

    @media (max-width: 380px) {
      body {
        padding: 14px 10px;
      }

      .calculator {
        margin-top: 20px;
        padding: 24px 18px;
        border-radius: 20px;
      }

      h1 {
        font-size: 24px;
      }

      .result-label {
        font-size: 15px;
      }

      .result-value {
        font-size: 19px;
      }
    }
  </style>
</head>

<body>
  <main class="calculator">
    <h1>아울렛 부가세 계산기</h1>

    <div class="field">
      <label for="discountRate">추가 할인율</label>

      <div class="input-wrap">
        <input
          id="discountRate"
          type="text"
          inputmode="decimal"
          placeholder="0"
          autocomplete="off"
        >
        <span class="unit">%</span>
      </div>
    </div>

    <div class="field">
      <label for="originalPrice">상품 가격</label>

      <div class="input-wrap">
        <input
          id="originalPrice"
          type="text"
          inputmode="numeric"
          placeholder="0"
          autocomplete="off"
        >
        <span class="unit">원</span>
      </div>
    </div>

    <section class="results">
      <div class="result-row purchase">
        <span class="result-label">구매가</span>
        <strong id="purchasePrice" class="result-value">0원</strong>
      </div>

      <div class="result-row">
        <span class="result-label">부가세 환급 금액</span>
        <strong id="vatAmount" class="result-value">0원</strong>
      </div>

      <div class="result-row">
        <span class="result-label">공급가액</span>
        <strong id="supplyAmount" class="result-value">0원</strong>
      </div>
    </section>
  </main>

  <script>
    const discountInput = document.getElementById("discountRate");
    const priceInput = document.getElementById("originalPrice");

    const purchaseOutput = document.getElementById("purchasePrice");
    const vatOutput = document.getElementById("vatAmount");
    const supplyOutput = document.getElementById("supplyAmount");

    function getNumber(value) {
      const cleaned = value
        .replace(/,/g, "")
        .replace(/[^\d.]/g, "");

      return parseFloat(cleaned) || 0;
    }

    function formatWon(value) {
      return Math.round(value).toLocaleString("ko-KR") + "원";
    }

    function calculate() {
      const originalPrice = getNumber(priceInput.value);

      const discountRate = Math.min(
        100,
        Math.max(0, getNumber(discountInput.value))
      );

      const purchasePrice = Math.round(
        originalPrice * (1 - discountRate / 100)
      );

      const vatAmount = Math.round(purchasePrice / 11);
      const supplyAmount = purchasePrice - vatAmount;

      purchaseOutput.textContent = formatWon(purchasePrice);
      vatOutput.textContent = formatWon(vatAmount);
      supplyOutput.textContent = formatWon(supplyAmount);
    }

    priceInput.addEventListener("input", function () {
      const digits = this.value.replace(/\D/g, "");

      this.value = digits
        ? Number(digits).toLocaleString("ko-KR")
        : "";

      calculate();
    });

    discountInput.addEventListener("input", function () {
      let value = this.value.replace(/[^\d.]/g, "");
      const firstDot = value.indexOf(".");

      if (firstDot !== -1) {
        value =
          value.slice(0, firstDot + 1) +
          value.slice(firstDot + 1).replace(/\./g, "");
      }

      this.value = value;
      calculate();
    });

    [discountInput, priceInput].forEach((input) => {
      input.addEventListener("focus", function () {
        setTimeout(() => this.select(), 50);
      });

      input.addEventListener("click", function () {
        this.select();
      });
    });

    calculate();
  </script>
</body>
</html>
