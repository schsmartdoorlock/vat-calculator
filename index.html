<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>아울렛 부가세 계산기</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif;background:#f4f4f4;display:flex;justify-content:center;padding:20px}
.card{background:#fff;max-width:420px;width:100%;padding:24px;border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.1)}
label{display:block;font-weight:700;margin:16px 0 8px}
input{width:100%;padding:14px;font-size:20px;border:1px solid #ccc;border-radius:10px}
.row{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid #eee}
.value{font-weight:700}
</style>
</head>
<body>
<div class="card">
<h2>아울렛 부가세 계산기</h2>
<label>추가 할인율 (%)</label>
<input id="rate" inputmode="decimal">
<label>상품 가격 (원)</label>
<input id="price" inputmode="numeric">
<div class="row"><span>구매가</span><span class="value" id="buy">0원</span></div>
<div class="row"><span>부가세 환급 금액</span><span class="value" id="vat">0원</span></div>
<div class="row"><span>공급가액</span><span class="value" id="supply">0원</span></div>
</div>
<script>
const p=document.getElementById('price'),r=document.getElementById('rate');
const buy=document.getElementById('buy'),vat=document.getElementById('vat'),sup=document.getElementById('supply');
const num=v=>parseFloat(v.replace(/,/g,'').replace(/[^\d.]/g,''))||0;
const fmt=n=>Math.round(n).toLocaleString('ko-KR')+'원';
function calc(){
 let price=num(p.value), rate=Math.min(100,Math.max(0,num(r.value)));
 let purchase=Math.round(price*(1-rate/100));
 let v=Math.round(purchase/11);
 buy.textContent=fmt(purchase);
 vat.textContent=fmt(v);
 sup.textContent=fmt(purchase-v);
}
p.oninput=e=>{let d=e.target.value.replace(/\D/g,'');e.target.value=d?Number(d).toLocaleString('ko-KR'):'';calc();}
r.oninput=calc;
</script>
</body>
</html>
